services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raidy
      POSTGRES_USER: raidy
      POSTGRES_PASSWORD: raidy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raidy"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - raidy-db:/var/lib/postgresql/data

volumes:
  raidy-db:
