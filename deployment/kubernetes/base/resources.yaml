apiVersion: v1
kind: Namespace
metadata:
  name: raidy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: raidy-config
data:
  APP_BASE_URL: https://raidy.example.com
  HTTP_ADDR: ":8080"
  WEB_DIST_DIR: /app/web
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: raidy
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: raidy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: raidy
    spec:
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: raidy
            - name: POSTGRES_USER
              value: raidy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "raidy", "-d", "raidy"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "raidy", "-d", "raidy"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "raidy", "-d", "raidy"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: raidy
spec:
  selector:
    app.kubernetes.io/name: raidy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raidy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: raidy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raidy
        app.kubernetes.io/part-of: raidy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: raidy
          image: ghcr.io/joshchen-dev/raidy:v0.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: raidy-config
                  key: APP_BASE_URL
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: raidy-config
                  key: HTTP_ADDR
            - name: WEB_DIST_DIR
              valueFrom:
                configMapKeyRef:
                  name: raidy-config
                  key: WEB_DIST_DIR
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: DISCORD_TOKEN
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: DISCORD_GUILD_ID
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raidy-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://raidy:$(POSTGRES_PASSWORD)@postgres:5432/raidy?sslmode=disable
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
