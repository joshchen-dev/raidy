name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: raidy_test
          POSTGRES_USER: raidy
          POSTGRES_PASSWORD: raidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raidy -d raidy_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://raidy:raidy@localhost:5432/raidy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check version
        working-directory: ${{ github.workspace }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version=$(node -p "require('./web/package.json').version")
          lock_version=$(node -p "require('./web/package-lock.json').version")
          test "$version" = "$lock_version"
          grep -Fq "**Status:** \`v${version}\`" README.md
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_TITLE" =~ ^(feat|fix)(\(.+\))?!?: ]]; then
            if git cat-file -e "origin/${GITHUB_BASE_REF}:web/package.json" 2>/dev/null; then
              base_version=$(git show "origin/${GITHUB_BASE_REF}:web/package.json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk).on('end', () => console.log(JSON.parse(value).version))")
            else
              base_version=$(git show "origin/${GITHUB_BASE_REF}:README.md" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk).on('end', () => console.log(value.match(/v([0-9]+\.[0-9]+\.[0-9]+)/)[1]))")
            fi
            expected=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log(major + '.' + minor + '.' + (patch + 1))" "$base_version")
            test "$version" = "$expected"
          fi
      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web console
        working-directory: web
        run: npm run build
      - name: Validate Kubernetes manifests
        working-directory: ${{ github.workspace }}
        run: kubectl kustomize deployment/kubernetes/overlays/local >/dev/null
      - name: Build container
        working-directory: ${{ github.workspace }}
        run: docker build --tag raidy:ci .
